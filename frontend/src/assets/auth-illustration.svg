<svg width="480" height="380" viewBox="0 0 480 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10" y="-10" width="500" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Main IDE Window Frame -->
  <g filter="url(#subtleShadow)">
    <rect x="40" y="30" width="400" height="280" rx="14" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect x="40" y="30" width="400" height="36" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="40" y="52" width="400" height="14" fill="#0f172a"/>
    
    <!-- Window Controls -->
    <circle cx="62" cy="48" r="5" fill="#ef4444" opacity="0.85"/>
    <circle cx="78" cy="48" r="5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="94" cy="48" r="5" fill="#10b981" opacity="0.85"/>

    <!-- File Tab -->
    <rect x="120" y="38" width="110" height="28" rx="6" fill="#1e293b"/>
    <text x="135" y="56" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" font-weight="600">solution.py</text>

    <!-- Code Lines -->
    <!-- Line numbers -->
    <text x="58" y="94" font-family="monospace" font-size="11" fill="#475569">1</text>
    <text x="58" y="118" font-family="monospace" font-size="11" fill="#475569">2</text>
    <text x="58" y="142" font-family="monospace" font-size="11" fill="#475569">3</text>
    <text x="58" y="166" font-family="monospace" font-size="11" fill="#475569">4</text>
    <text x="58" y="190" font-family="monospace" font-size="11" fill="#475569">5</text>

    <!-- Syntax Highlighted Code -->
    <text x="80" y="94" font-family="'Fira Code', monospace" font-size="11" fill="#c084fc">def <tspan fill="#60a5fa">analyze_code</tspan><tspan fill="#e2e8f0">(source):</tspan></text>
    <text x="96" y="118" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">diagnostics = detect_errors(source)</text>
    <text x="96" y="142" font-family="'Fira Code', monospace" font-size="11" fill="#f43f5e">explain_issues<tspan fill="#e2e8f0">(diagnostics)</tspan></text>
    <text x="96" y="166" font-family="'Fira Code', monospace" font-size="11" fill="#c084fc">return <tspan fill="#38bdf8">True</tspan></text>

    <!-- Underline Error Squiggly -->
    <path d="M 96,148 Q 100,152 104,148 T 112,148 T 120,148 T 128,148 T 136,148 T 144,148 T 152,148 T 160,148 T 168,148 T 176,148" fill="none" stroke="#f43f5e" stroke-width="1.8"/>

    <!-- AI Diagnostic Popup Badge -->
    <g transform="translate(190, 180)">
      <rect width="230" height="96" rx="10" fill="#090d16" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="20" cy="24" r="9" fill="#3b82f6" fill-opacity="0.2"/>
      <path d="M 17,24 L 19,26 L 24,21" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <text x="36" y="27" font-family="sans-serif" font-size="11" fill="#60a5fa" font-weight="700">AI Diagnostic Mentor</text>
      <text x="16" y="49" font-family="sans-serif" font-size="10" fill="#e2e8f0" font-weight="600">Syntax Verified &amp; Explained</text>
      <text x="16" y="66" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Real-time compiler intelligence</text>
      <text x="16" y="81" font-family="sans-serif" font-size="9.5" fill="#94a3b8">pedagogical error guidance.</text>
    </g>
  </g>
</svg>
